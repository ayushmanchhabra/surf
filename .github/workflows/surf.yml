name: surf

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
        # - windows-latest
        # - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Install Pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install libcurl library
        run: sudo apt install libcurl4-openssl-dev
      - name: Compile debug build
        run: make debug
      - name: Test debug build
        run: make test
